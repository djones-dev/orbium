version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api
    networks:
      - orbium-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://orbium:orbium_secret@db:5432/orbium_db
    depends_on:
      - db
    networks:
      - orbium-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=orbium
      - POSTGRES_PASSWORD=orbium_secret
      - POSTGRES_DB=orbium_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orbium-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - orbium-network

networks:
  orbium-network:
    driver: bridge

volumes:
  postgres_data:
