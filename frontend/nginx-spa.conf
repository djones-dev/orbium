server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache headers
    location ~* \.(js|css|wasm|woff2?|ttf|eot|ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths serve index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AudioWorklet .js files must not be cached between deploys
    location ~* \.worklet\.js$ {
        expires off;
        add_header Cache-Control "no-store";
    }
}
